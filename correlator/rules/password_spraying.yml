# STATUS: not yet tested end to end - pushed on request for review (22/09/2026). See tests/TESTPLAN.md.
# NOTE: uses the Sigma "value_count" correlation type, which is not yet validated
# on the Concerto correlator. Only "event_count" has been proven end to end.
# Compile-test before relying on this rule.
title: Authentication denied
name: authentication_denied_spray
description: Denied authentication, used as the base event for spraying detection.
logsource:
    category: alerts
detection:
    selection:
        Category: Access.Unauthorized
        Analyzer.Data: Authentication
    condition: selection
---
title: Password spraying (one source, many accounts)
description: A single source IP failing authentication against many distinct accounts - the inverse pattern of a brute force.
idmefv2:
  Category:
    - "Access.Forced"
  Priority: "High"
correlation:
    type: value_count
    rules:
        - authentication_denied_spray
    group-by:
        - Source_IP
    timespan: 10m
    field: Target_User
    condition:
        gte: 8
    generate: true
