# IDMEFv2 mapping - generated by tools/gen_mappings.py
# 2/2 rules validated by the reviewer.
ruleset:
  name: vpopmail
  rules:
    - id: 2100
      fields:
        "[@metadata][IDMEFv2][source]": "source"
        "[@metadata][IDMEFv2][target]": "host"
        "[Category][0]": "Operational.Other"
        "[Analyzer][Data]":
          - "Log"
          - "Relay"
        "[Type]": "Cyber"
        "[Priority]": "Info"
        "[Target][0][User]": "%{[Attachment][RawLog][Content][user][name]}"
        "[Description]": "%{[Attachment][RawLog][Content][message]}"
    - id: 2101
      fields:
        "[@metadata][IDMEFv2][source]": "source"
        "[@metadata][IDMEFv2][target]": "host"
        "[Category][0]": "Availability.Failure"
        "[Analyzer][Data]":
          - "Log"
          - "Relay"
        "[Type]": "Cyber"
        "[Priority]": "Medium"
        "[Target][0][User]": "%{[Attachment][RawLog][Content][user][name]}"
        "[Description]": "%{[Attachment][RawLog][Content][message]}"
