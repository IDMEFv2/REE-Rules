          - "Log"
          - "Content"
        "[Type]": "Cyber"
        "[Priority]": "Info"
        "[Target][0][User]": "%{[Attachment][RawLog][Content][user][target][name]}"
        "[Description]": "%{[Attachment][RawLog][Content][message]}"
    - id: 50003
      fields:
        "[@metadata][IDMEFv2][target]": "host"
        "[Category][0]": "Availability.Failure"
        "[Analyzer][Data]":
          - "Log"
          - "Content"
        "[Type]": "Cyber"
        "[Priority]": "Medium"
        "[Description]": "%{[Attachment][RawLog][Content][message]}"
